name: Apply reviewed chain fixes

on:
  push:
    branches: [audit/full-chain-5.2.13-20260917]
    paths: [.github/workflows/apply-chain-fixes.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Lang45/codex-lean-stack' && github.ref == 'refs/heads/audit/full-chain-5.2.13-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and apply exact reviewed patch
        env:
          PATCH_B64: |
            
            
            
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '1b211594216ca654889b130bb0d308b503cd593a'
          allowed_drift = {'.github/workflows/chain-audit.yml', '.github/workflows/apply-chain-fixes.yml'}
          drift = set(git('diff', '--name-only', base, 'HEAD').splitlines())
          if not drift <= allowed_drift:
              raise SystemExit('Source changed since review: ' + repr(sorted(drift)))
          patch = lzma.decompress(base64.b64decode(os.environ['PATCH_B64']))
          if hashlib.sha256(patch).hexdigest() != 'cfe4729e722ebeb3d2b5450ab27ddd41cb9beb1bca7cb088491acaf2bcc2093d':
              raise SystemExit('Patch digest mismatch')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-chain-fixes.patch'
          target.write_bytes(patch)
          allowed = {'.codex-plugin/plugin.json', 'CHANGELOG.md', 'Jiao-Jie.md', 'README.md', 'docs/audits/5.2.13-full-chain.md', 'skills/lean-stack/SKILL.md', 'skills/lean-stack/references/delegation.md', 'skills/lean-stack/references/execution-routing.md', 'skills/lean-stack/references/review.md', 'skills/lean-stack/references/specialist-memory.md', 'skills/lean-stack/references/versioning.md', 'skills/lean-stack/scripts/agents.py', 'skills/lean-stack/scripts/cost_check.py', 'skills/lean-stack/scripts/install_plugin.py', 'tests/test_chain_audit.py', 'tests/test_documentation_audit.py', 'tests/test_skill_contract.py', 'tests/test_windows_exec_probe.py'}
          stats = git('apply', '--numstat', str(target))
          actual = {line.split('\t', 2)[2] for line in stats.splitlines()}
          if actual != allowed:
              raise SystemExit('Unexpected patch paths: ' + repr(actual ^ allowed))
          print(stats)
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '--whitespace=error', str(target)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Run all regressions before publishing
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Commit only the reviewed source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve activation and experience chains in 5.2.14'
          git push origin HEAD:refs/heads/audit/full-chain-5.2.13-20260917
          git rev-parse HEAD
