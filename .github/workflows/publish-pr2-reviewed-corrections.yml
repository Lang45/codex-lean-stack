name: Publish reviewed PR 2 corrections

on:
  push:
    branches: [audit/full-chain-5.2.13-20260917]
    paths: [.github/workflows/publish-pr2-reviewed-corrections.yml]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Lang45/codex-lean-stack' && github.ref == 'refs/heads/audit/full-chain-5.2.13-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify the exact approved patch and reconstructed tree
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess, tempfile
          BASE = '98be3041593dc251840a7531003540b26d04c12f'
          WORKFLOW = '.github/workflows/publish-pr2-reviewed-corrections.yml'
          EXPECTED_TREE = 'a99ce5869aaf8e0a89cb02cfd61bf8706ca3397b'
          def git(*args, env=None):
              return subprocess.check_output(['git', *args], text=True, env=env).strip()
          assert git('diff', '--name-only', BASE, 'HEAD') == WORKFLOW, 'Source changed since the reviewed baseline'
          assert not git('status', '--porcelain'), 'Unexpected working-tree changes'
          payload = (
          ''
          ''
          ''
          )
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bfb9ba4ed3aef68e46e2a2ce2c71c3f119945c75d64e42ba615fb887bac05253', 'Patch integrity mismatch'
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-pr2.patch'
          patch_path.write_bytes(patch)
          git('apply', '--check', '--index', str(patch_path))
          git('apply', '--index', str(patch_path))
          git('diff', '--cached', '--check')
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert len(changed) == 14 and WORKFLOW not in changed, changed
          with tempfile.TemporaryDirectory() as temporary:
              env = os.environ.copy()
              env['GIT_INDEX_FILE'] = str(pathlib.Path(temporary) / 'index')
              git('read-tree', git('write-tree'), env=env)
              git('update-index', '--force-remove', WORKFLOW, env=env)
              actual_tree = git('write-tree', env=env)
              assert actual_tree == EXPECTED_TREE, (actual_tree, EXPECTED_TREE)
          print('VERIFIED_PATCH_SHA256=bfb9ba4ed3aef68e46e2a2ce2c71c3f119945c75d64e42ba615fb887bac05253')
          print('VERIFIED_FINAL_TREE=' + EXPECTED_TREE)
          print('VERIFIED_CHANGED_FILES=14')
          PY
      - name: Run all regressions before publishing
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Publish only to the existing PR branch without force
        shell: bash
        env:
          EXPECTED_REMOTE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='audit/full-chain-5.2.13-20260917'
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_REMOTE_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: close PR 2 independent-review gaps without removing features'
          git push origin "HEAD:refs/heads/$branch"
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
