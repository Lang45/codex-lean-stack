name: Apply independent review corrections

on:
  push:
    branches: [audit/full-chain-5.2.13-20260917]
    paths: [.github/workflows/apply-independent-review.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify, test and commit the exact reviewed patch
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git', *args])
          baseline = '98be3041593dc251840a7531003540b26d04c12f'
          workflow = '.github/workflows/apply-independent-review.yml'
          changed = git('diff', '--name-only', baseline, 'HEAD').decode().splitlines()
          if changed != [workflow]:
              raise SystemExit('The branch changed since review; refusing to overwrite it.')
          encoded = '''
          
          
          '''
          patch = zlib.decompress(base64.b64decode(encoded))
          expected = '7570928338f82e13e396756fc2032576a7eee0b218d24644991622c7559d9967'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'independent-review.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          staged = git('diff', '--cached', '--full-index', '--binary')
          if hashlib.sha256(staged).hexdigest() != expected:
              raise SystemExit('Applied tree differs from reviewed patch')
          subprocess.run(['python', '-X', 'utf8', '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: close independent review findings without removing plugin capabilities'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/audit/full-chain-5.2.13-20260917'], check=True)
