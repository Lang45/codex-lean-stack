name: Full-chain audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Behavior, integration, and contract tests
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Build verifiable audited source artifact
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --output=audit-source.tar HEAD
          git archive --format=tar --output=audit-source.repeat.tar HEAD
          cmp --silent audit-source.tar audit-source.repeat.tar
          rm audit-source.repeat.tar
          sha256sum audit-source.tar > audit-source.tar.sha256
          sha256sum -c audit-source.tar.sha256
      - name: Retain source snapshot for reproducible review
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-source-${{ github.sha }}
          path: |
            audit-source.tar
            audit-source.tar.sha256
          retention-days: 7
          if-no-files-found: error
