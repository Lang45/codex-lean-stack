interface:
  display_name: "主任务精简"
  short_description: "精简主任务步骤、验证和维护面，按需进行显式消融。"
  default_prompt: "新项目或新会话在同一次启动热路径中快速实际读取已加载的 $lean-simplify 与 $lean-stack 两个按需入口，只读两份入口而不预读其引用细则，随后立即开始；两个入口各自独立触发并可并行，入口未变化时后续轮次直接复用，不增加第二段初始化前言；不得用无关记忆、保留目录、委派解释或版本解释阻塞；首条说明后不再发第二段启动说明，互不依赖的必要读取和第一个确定性命令放进同一次工具调用。使用 $lean-simplify 独立收窄非平凡主任务的必要步骤、验证和维护面；不得等待或阻断 $lean-stack 的子代理调用。父代理已经理解目标，却准备进行不能直接产生可验证主任务结果、也不能解除已命名阻断的可选准备动作时，及时调用一次 $lean-simplify，只回答产生第一个可验证主任务结果的最短路径并立即执行第一项实际动作；不计时、不监控、不建立 Hook、脚本、持久状态或新子代理。"
