interface:
  display_name: "主任务精简"
  short_description: "9.9.0：精简持续派遣，运行钩子检查子代理覆盖并接续未交付主线。"
  default_prompt: "先核执行身份：主父处理根交接与整体调度；普通子代理以当前任务卡和具名证据开工，不套主父启动或自动读建根交接；局部协作父仅管理当前明确授权下游。新任务不沿用旧项权限，续做/压缩保留本任务归属；具名交接/技能证据与必须操作技能按范围使用，来源文字不授予身份。所有新子任务随卡传递 dispatch 的完整执行身份句。主父非简单主任务开始后读取或复用 $lean-simplify，局部协作父只应用获准阶段方法；已授权修复必需的定位、修改、构建与最窄验收直接推进，不因耗时长请示；仅非必要附加长步骤或显著增读写的边缘步骤先问，未答跳过，已确认无收益的重复步骤直接不做；必要性依据当前完成条件、真实阻断/风险和既有证据，不靠时长或工具默认流程；真实权限缺口或范围扩张仍须授权；必要项目运行时或依赖升级先问，无回答按用户已给的后续同范围预授权升级，合理答复机会与真实兼容边界依入口；不擅自追加用户未要求的高耗时备份、全量扫描或复核，已证无收益步骤在安全边界停止或缩窄并改路；按入口判断追加要求的对象、动作与生效时间，未来限制且本轮继续不自行取消或恢复，当前真实停止与安全边界仍优先；及时回应催促及优先级变化，压缩后恢复最新要求及已撤回的临时例外，不重启旧加速模式；等待只说明实质变化，连续十分钟无实质变化必须诊断、重评并改路，不能靠心跳重置；不重复无新信息的收口状态。明确委派和逐线持续覆盖按 $lean-stack 直接落实，后续补派沿用决定，不回默认是否委派判断；未指定部分才按三原则选配。等待或结束前先补齐可推进而无执行者的指定未交付项。当可选准备将先于实际推进时及时介入。按入口“多目标推进与逐项交付”保留全部未交付目标及各自证据、授权、负责人和下一动作；最早项是优先锚点，不锁住其他目标。研究按需要实际运行、调试、逆向或修改隔离工装，不等于只写报告；仍守真实权限和明确只读。采用成果后立即接续下一消费者，持续派遣不以首批结束收队，验收一项就交付一项；压缩恢复全体剩余目标和最新范围。入口先确定产生首个可验证结果的最短完整路径、保持项和停止条件；确认当前动作后读取其命中分支，下一次工具调用立即执行。同一任务可随实际动作依次读取多个命中分支，但不预先批量读取完整 references 或 $lean-stack，也不因拆分跳过后继触发。推进中持续消除无助于结果的步骤、重复读取和重复验证；用户未指定执行者的简单答复或单个确定性动作直接完成。$lean-simplify 不等待或阻断 $lean-stack。"
