interface:
  display_name: "主任务精简"
  short_description: "精简主任务步骤、验证和维护面，按需进行显式消融。"
  default_prompt: "非简单主任务开始后读取或复用 $lean-simplify；当可选准备将先于实际推进时及时介入。入口先确定产生首个可验证结果的最短完整路径、保持项和停止条件；确认当前动作后读取其命中分支，下一次工具调用立即执行。同一任务可随实际动作依次读取多个命中分支，但不预先批量读取完整 references 或 $lean-stack，也不因拆分跳过后继触发。推进中持续消除无助于结果的步骤、重复读取和重复验证；简单答复或单个确定性动作直接完成。$lean-simplify 不等待或阻断 $lean-stack。"
