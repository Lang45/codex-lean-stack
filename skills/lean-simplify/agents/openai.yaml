interface:
  display_name: "主任务精简"
  short_description: "精简主任务步骤、验证和维护面，按需进行显式消融。"
  default_prompt: "新项目或新会话从已加载技能目录识别 $lean-simplify 与 $lean-stack 两个按需入口，只读取当前动作命中的入口，不能开头通读两份或为插件增加第二段初始化前言；识别后立即开始，不得用无关记忆、完整细则、委派解释或版本解释阻塞；首条说明后不再发第二段启动说明，互不依赖的必要读取和第一个确定性命令放进同一次工具调用。使用 $lean-simplify 独立收窄非平凡主任务的必要步骤、验证和维护面；不得等待或阻断 $lean-stack 的子代理调用。"
