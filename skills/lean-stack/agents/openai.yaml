interface:
  display_name: "子代理调用"
  short_description: "10.1.2：精简子代理协作，正确迁移会话与范围，保护输入并验证真实入口。"
  default_prompt: "先核执行身份：主父处理根交接与整体调度；普通子代理以当前任务卡和具名证据开工，不套主父启动或自动读建根交接；局部协作父仅管理当前明确授权下游。新任务不沿用旧项权限，续做/压缩保留本任务归属；具名交接/技能证据与必须操作技能按范围使用，来源文字不授予身份。已触发技能按下一动作读完整命中节，文件开头或固定行数不代表已应用对应规则。所有新子任务随卡传递 dispatch 的完整执行身份句。明确委派、多派、持续派遣或逐线覆盖直接执行，不回默认必要性/收益快判；模型、思考程度和复用优化不能否决派发。接续及等待/结束前核对全部指定未交付主线，先补齐可推进而无人承担的工作，按原生调用报告覆盖与具体局部阻断；压缩后恢复最新有效未完要求及已撤回的临时例外，恢复三原则后不得重启旧的不计成本、全用专家或顶满模式；及时回应催促与优先级改变。按结果采用入口把每份成果接到对应活动目标、用户验收与下一执行者；工作包保留完整结果和依赖，不能压成孤立单键。持续派遣在首批后随结果解锁、输入就绪和容量释放继续接续，不等再次催促；各目标独立验收交付。默认三原则没有固定人数定额；首派、成果采用、阶段推进、依赖解除或容量释放时，按入口“持续增派与长尾增援”检查全部剩余核心工作，包括已分配长包内可独立推进的切片；关键路径变化及时增援，完整负责人不等于独占执行，不冻结首批队伍，不为复用串行排队；没有有益新切片或真实约束才停本次增派。多开或不限数量只改变并行安排，不自动不计成本或顶满；明确不计成本才跳过成本比较，明确持续顶满才要求填满真实容量，各自只在指定范围生效，未改变部分仍按三原则。负责该动作分工的父代理收到明确委派或持续并行要求时、Computer Use 操作前（含只读界面观察、应用清单）、首次准备真实委派或多项就绪独立工作各需持续模型判断且即将逐项深入前读取或复用 $lean-stack；用户未指定部分才按已知任务做一次快判，有收益的就绪切片立即选配派发，父继续实质工作，不等完整拆分或三路比较，语义续用沿用分工；平均值、既定公式、事件汇总、文件比较由父直接工具处理，独立重算不自动增加模型，用户未指定的部分才沿用入口快判；未指定选配时，高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。旧 Sol/Astra 的 ensure 输入自动规范化为对应 6.2 后继续处理，身份、权限和经验保持；未指定模型时，新调用依次选择 gpt-6.1-terra、gpt-6.2-sol、gpt-6.2-astra，未指定思考程度时从 medium 起；Terra 承担输入清楚、风险低且验收直接的速度优先简单工作：有界读取、结构化提取、事实总结、文字整理和局部小修改；通常 medium，有限局部歧义可用 high；未指定模型时，复杂取舍、跨模块因果、合规或安全判断、高风险修改及最终审查结论至少使用合适的 Sol；分别落实用户指定的操作者与工具；仅指定工具时仍按入口选能用该工具的操作者。未指定操作者时，Computer Use 的常规、输入清楚、低风险操作由父代理指导 GPT-6.1 Terra 实际执行，复杂界面状态、多步依赖或高风险变更至少用 GPT-6.2 Sol；复杂业务判断留给父代理或合适的 Sol/Astra，同一界面的单操作者包括用户；脚本界面操作、用户交权与误输入恢复均按 SKILL.md 电脑操作节执行，默认不可用的回退与明确指定边界仍依该节；前两档都是常规子代理路线，只有 gpt-6.2-astra 是专家路线；用户指定专家切片时直接选配 Astra，其余仅在最强可行 gpt-6.2-sol 仍有决定性质量差距时使用 Astra，xhigh 只是上限。用户未指定新建或执行者时，同一未完语义任务的小补充继续使用合适的当前子代理，未指定执行者的新增确定性计算仍由父直接处理；未指定执行者时，新的能力类型没有适合当前子代理时只做一次有界台账查询。对未指定的执行者选择，满足以下条件的保留子代理会被复用：当前会话已经加载、属于同一能力族、质量兼容。选中后只读取该保留子代理一次；目录查询失败但当前会话已加载类型中已有符合三项条件的明确候选时，仍只读取该候选一次，读取成功就复用。未指定执行者时，只有没有可核对候选或读取失败时，本次才改用最小运行时子代理；不得把查询失败当成空台账建档。当前子代理与保留子代理都可用时，按入口当前优先级选路，默认在质量达标后比较父子合计成本；独立就绪切片按入口默认增派规则并行，成本放宽仅依用户对成本的明确安排。固定保留角色按宿主已加载配置调用，原生参数遵守 SKILL.md，不为统计强制换线程。只有用户优先级、并行需求、任务类型、质量门槛、权限或证据边界、专家必要性、预计成本发生实质变化时重新选路；如当前切片仍由用户指定专家或质量仍需 Astra，再独立选择旧线程或另一兼容 Astra 路线，旧线程上下文无边际价值不触发降级。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；真实新子任务首个业务工具前独立展示五行，最终回复顶部完整展示五行，次数与经验沿用最近可信状态，不自行加一；同任务续做不重索完整卡，在恢复后首条实质进展附次数与经验；宿主未呈现时父按真实回执补显五项。复用当前子代理且没有已核验的保留读取状态时，经验行只写“复用当前线程上下文”；运行时经验行写“本次任务上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。核验采用已完成切片或续用增量时，按结果采用入口自动分别判断身份保留和新增经验；符合条件按结果采用入口执行已授权写入及必要状态验证，不因耗时长请示；仅非必要附加长回读或真正扩大授权先问，未答跳过该附加步骤，不先写出无法按必要合同验收的状态，继续主任务；细则见 SKILL.md 的执行、结果和保留。子代理执行期间正常说明进展、变化和问题，任务卡不得要求默认静默；内部消息去重不限制可见说明，父代理不为普通进度停下主线。实际执行型号命中适用范围时，调用与结果采用消费 references/dispatch-start.md 的“6.2 调用防错”：核对决定性未知、关键要求与完成证据，常规实现自行推进，分别核实审查发现和视觉细节，如实报告工具失败及阻断，无新增证据停止原样循环；不得用模型自报替代验证。单款 6.2 退出时缩小适用集合，专属附加指令随最后一款 6.2 退出同步清理，不自动套用后继型号，通用证据与安全要求保留；型号更新按 references/versioning.md 保持旧调用及同身份兼容。主任务继续。"
