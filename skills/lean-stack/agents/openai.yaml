interface:
  display_name: "子代理调用"
  short_description: "按质量、成本、时间选择工具、四模型子代理与思考程度。"
  default_prompt: "出现具体委派候选，且本轮首次准备 spawn_agent 或以 followup_task 启动新子任务时，读取或复用 $lean-stack。先按质量、成本、提速判断并确定切片、模型与思考程度；不通过便继续主任务，不查 status/recall。确认派发后读 dispatch-start；本次调用同时命中派发前分支时依次只读命中项，补齐任务卡后立即派发。后续动作仍可依次命中多个分支，不批量预读完整 references 或 $lean-simplify，也不因拆分跳过后继触发。每次 spawn_agent 显式传 model、reasoning_effort 和非全量 fork_turns；名称、模型、思考程度、存活轮次、经验五行实际值只写内部任务卡，由子代理本人开场，父代理不代述。父子不重复完整读取同源或执行同一已分配职责；父代理保留整合、共享热点和必要高风险定向核验。结果核验采用后继续命中保留分支：已有专家记录完成，可泛化的新专家先保存身份再记录完成；仅明确排除项跳过并留收据，侧支不阻塞交付。$lean-stack 不等待或阻断 $lean-simplify。"
