interface:
  display_name: "子代理调用"
  short_description: "主任务精简与四档子代理调用并行，保留子代理按三项条件优先复用。"
  default_prompt: "首次准备真实委派时读取或复用 $lean-stack；高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。新调用依次选择 gpt-5.6-luna、gpt-6-sol、gpt-5.6-sol、gpt-6-astra，思考程度从 medium 起；Luna 只做有界读取、结构化提取和事实总结，持续判断至少使用合适的 Sol；前三档都是常规子代理路线，只有 gpt-6-astra 是专家路线；Astra 仅在最强可行 gpt-5.6-sol 仍有决定性质量差距时使用，xhigh 只是上限。同一任务小补充继续使用合适的当前子代理；新的能力类型没有适合当前子代理时只做一次有界台账查询。满足以下条件的保留子代理会被复用：当前会话已经加载、属于同一能力族、质量兼容。选中后只读取该保留子代理一次；目录查询失败但当前会话已加载类型中已有符合三项条件的明确候选时，仍只读取该候选一次，读取成功就复用。只有没有可核对候选或读取失败时，本次才改用最小运行时子代理；不得把查询失败当成空台账建档。当前子代理与保留子代理都可用时，质量达标后选择父子合计总成本更低的一条，不为统计强制换线程。只有任务类型、质量门槛、权限或证据边界、专家必要性、预计成本发生实质变化时重新选路；若当前质量仍需 Astra，再独立选择旧线程或另一兼容 Astra 路线，旧线程上下文无边际价值不触发降级。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；首条进展说明展示五行，最终回复顶部重复前三行。复用当前子代理且没有已核验的保留读取状态时，经验行只写“复用当前线程上下文”；运行时经验行写“本次任务上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。运行时子代理在以下条件成立时选择性建档：预计以后确实还会遇到同类任务、预计复用收益高于维护和查找负担、没有兼容的现有能力族。主任务继续。"
