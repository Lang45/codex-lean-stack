interface:
  display_name: "子代理调用"
  short_description: "主任务精简与四档子代理调用并行，优先复用保留身份。"
  default_prompt: "首次准备真实委派时读取或复用 $lean-stack；高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。新调用依次选择 gpt-5.6-luna、gpt-6-sol、gpt-5.6-sol、gpt-6-astra，思考程度从 medium 起；Luna 只做有界读取、结构化提取和事实总结，持续判断至少使用合适的 Sol；前三档都是常规子代理路线，只有 gpt-6-astra 是专家路线；Astra 仅在最强可行 gpt-5.6-sol 仍有决定性质量差距时使用，xhigh 只是上限。按 live child、具名保留 lean_* agent_type、generic 或运行时新建的顺序复用同能力族，保留类型优先；兼容保留类型必须召回并真实调用，回退写具体不兼容点，细则见 dispatch-start。每个新的 followup_task 增量切片按当前最小能力重新比较质量、总边际成本和时间；若当前质量仍需 Astra，再独立选择旧线程或另一兼容 Astra 路线，旧线程上下文无边际价值不触发降级。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；首条进展说明展示五行，final 顶部重复前三行。复用 live child 且没有已核验的保留召回状态时，经验行只写“复用当前线程上下文”；运行时经验行写“本次任务上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。结果采用后判断保留：合格独立新能力族必须尝试一次 ensure，不合格记录具体原因，主任务继续。"
