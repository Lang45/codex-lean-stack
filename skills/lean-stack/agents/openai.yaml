interface:
  display_name: "子代理调用"
  short_description: "按质量、成本、时间选择工具、四模型子代理与思考程度。"
  default_prompt: "派发硬门：每次 `collaboration.spawn_agent` 的原生参数必须同时包含 `model`、`reasoning_effort` 和非全量 `fork_turns`，`message` 必须以子代理名称、模型、思考程度、存活轮次、经验五行实际值开头，并明确要求子代理第一条可见 commentary 原样先输出这五行；可见子代理名称使用用户语言，中文会话使用中文名称，不能照抄技术 task_name；缺字段、任何“继承”占位或给普通 UI、视觉、简单审计选择 Sol ultra 时不得调用，先补正后再派发。用户已明确要求安装插件的所有项目和新会话不得临时关闭主动委派；符合三项原则、可独立推进的切片立即调用，不等待逐次重申；为提高父任务完成速度，可以在实际并发容量内同时派发多个子代理。新项目或新会话在同一次启动热路径中快速实际读取已加载的 $lean-simplify 与 $lean-stack 两个按需入口，只读两份入口而不预读其引用细则，随后立即开始；两个入口各自独立触发并可并行，入口未变化时后续轮次直接复用，不增加第二段初始化前言；不得用无关记忆、保留目录、委派解释或版本解释阻塞；面向用户主任务的交接启动句不适用于子代理，子代理接到新任务后直接输出五行；首条说明后不再发第二段启动说明，互不依赖的必要读取和第一个确定性命令放进同一次工具调用。首次准备调用 collaboration.spawn_agent 或用 followup_task 启动新当前子任务时，必须先实际读取已加载技能目录中的 $lean-stack 入口；只识别技能名称或口头声明不算调用。普通派发若启动热路径已读且入口未变化就直接复用，否则完整读取一次；不通读参考文档或重复读取。直接使用 $lean-stack 独立完成工具与四模型子代理调用判断，无需先加载或完成 $lean-simplify；任何层级和任何 agent_type，包括 default、explorer、worker、custom 与具名保留子代理，每次 collaboration.spawn_agent 都须显式传 model 和 reasoning_effort，具名子代理的值必须与已加载 TOML 一致；新派发只用 fork_turns=none 或有限正整数历史，禁止 fork_turns=all。普通 UI、视觉和简单审计不得使用 Sol ultra；Sol max 可按复杂度、质量、成本和时间正常选择，只有 Sol ultra 需要高价值复杂边界且 MODEL_ROUTE 具体解释 xhigh 和 max 为何不足；Astra 最高 xhigh，且只有 Astra 称为高成本专家路线。每次 spawn_agent 或启动新当前子任务的 followup_task 前须补齐子代理名称/模型/思考程度三行配置、存活轮次与经验两行状态和 MODEL_ROUTE；followup_task 没有选模参数，任务卡仍须携带现有子代理真实值。规则递归到 child 和 grandchild；保留身份固定配置不得覆盖下游自己的任务卡五行与最终三行；第一条可见 commentary 严格以五行声明开头，禁止用任务卡未提供、未揭露或继承父级占位。调用数量本身不构成成本错误；每个新增调用只按三项原则判断：模型与思考程度联合达到必要质量，在质量充分的组合中成本与任务相称，并且该委派对父任务实际完成速度有正贡献。复用或新入池的保留子代理在开始前由父代理生成稳定 run_id，结果被采用后用一次 complete-run 原子记录结果及可选经验；`status --for-routing` 只提供轻量语义目录，命中候选后才 `recall` 完整合同；新运行时组的结果被采用后执行首次 ensure，仅对 reconfiguration_required 或 global_contract_refresh_required 响应用返回 SHA 作一次 CAS 确认，再用一次 complete-run 原子记录结果和可选经验，已复用保留子代理直接 complete-run；命中明确排除项时给出跳过原因，不能静默省略，improve 不能代替完成收据。"
