interface:
  display_name: "子代理调用"
  short_description: "按质量、成本、时间选择工具、四档子代理与思考程度。"
  default_prompt: "首次准备真实委派时读取或复用 $lean-stack；高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。新调用依次选择 gpt-5.6-luna、gpt-6-sol、gpt-5.6-sol、gpt-6-astra，思考程度从 medium 起；前三档都是常规子代理路线，只有 gpt-6-astra 是专家路线；Astra 仅在最强可行 gpt-5.6-sol 仍有决定性质量差距时使用，xhigh 只是上限。按 live child、已加载 agent_type、运行时新建的顺序复用同能力族，细则见 dispatch-start。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；首条进展说明展示五行，final 顶部重复三行。复用 live child 且没有已核验的保留召回状态时，经验行只写“复用当前线程上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。结果核验后按需维护保留身份或经验，主任务继续。"
