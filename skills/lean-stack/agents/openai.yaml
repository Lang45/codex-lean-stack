interface:
  display_name: "子代理调用"
  short_description: "按质量、成本、时间选择工具、四模型子代理与思考程度。"
  default_prompt: "新项目或新会话从已加载技能目录识别 $lean-simplify 与 $lean-stack 两个按需入口，只读取当前动作命中的入口，不能开头通读两份或为插件增加第二段初始化前言；识别后立即开始，不得用无关记忆、完整细则、委派解释或版本解释阻塞；首条说明后不再发第二段启动说明，互不依赖的必要读取和第一个确定性命令放进同一次工具调用。直接使用 $lean-stack 独立完成工具与四模型子代理调用判断，无需先加载或完成 $lean-simplify；任何层级和任何 agent_type，包括 default、explorer、worker、custom 与具名保留子代理，每次 collaboration.spawn_agent 都须显式传 model 和 reasoning_effort，具名子代理的值必须与已加载 TOML 一致；新派发只用 fork_turns=none 或有限正整数历史，禁止 fork_turns=all。普通 UI、视觉和简单审计不得使用 Sol ultra；Sol max 可按复杂度、质量、成本和时间正常选择，只有 Sol ultra 需要高价值复杂边界且 MODEL_ROUTE 具体解释 xhigh 和 max 为何不足；Astra 最高 xhigh，且只有 Astra 称为高成本专家路线。每次 spawn_agent 或启动新当前子任务的 followup_task 前须补齐稳定 task_id、子代理名称/模型/思考程度三行配置、存活轮次与经验两行状态和 MODEL_ROUTE；followup_task 没有选模参数，任务卡仍须携带现有子代理真实值。规则递归到 child 和 grandchild；第一条可见 commentary 严格以五行声明开头，禁止用任务卡未提供、未揭露或继承父级占位。调用数量本身不构成成本错误；每个新增调用按其替代的父代理工作、必要质量或时间收益与完整增量成本判断，优化模型、思考程度、上下文、重复工作、交流、整合和复验，不按调用总数机械压缩。"
