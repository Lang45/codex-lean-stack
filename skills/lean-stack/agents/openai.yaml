interface:
  display_name: "子代理调用"
  short_description: "9.7.1：阻止多余备份复核，校正授权与子代理空等。"
  default_prompt: "先按用户明确指令优先落实是否委派、指定人数、并行方式、模型与思考程度、工具操作者及分工，三原则只补足未指定决策；不得以成本、工具优先、父实质工作或复用偏好缩减人数，按原生调用与当前状态报告真实数量及具体阻断，压缩后恢复最新有效未完要求及已撤回的临时例外，恢复三原则后不得重启旧的不计成本、全用专家或顶满模式；及时回应催促与优先级改变，就绪成果及时落地。当轮或当前任务明确要求不计成本、多开、并行数量不限或高负载顶满时，按入口进入持续并行提速，随进度与实际槽位释放持续补派，高负载且就绪切片充足时填满实际可用容量，范围结束后恢复默认三原则。Computer Use 操作前（含只读界面观察、应用清单）或首次准备真实委派时读取或复用 $lean-stack；用户未指定部分才按已知任务做一次快判，有收益的就绪切片立即选配派发，父继续实质工作，不等完整拆分或三路比较，语义续用沿用分工；平均值、既定公式、事件汇总、文件比较由父直接工具处理，独立重算不自动增加模型，用户未指定的部分才沿用入口快判；未指定选配时，高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。旧 Sol/Astra 的 ensure 输入自动规范化为对应 6.2 后继续处理，身份、权限和经验保持；未指定模型时，新调用依次选择 gpt-6.1-terra、gpt-6.2-sol、gpt-6.2-astra，未指定思考程度时从 medium 起；Terra 承担输入清楚、风险低且验收直接的速度优先简单工作：有界读取、结构化提取、事实总结、文字整理和局部小修改；通常 medium，有限局部歧义可用 high；未指定模型时，复杂取舍、跨模块因果、合规或安全判断、高风险修改及最终审查结论至少使用合适的 Sol；分别落实用户指定的操作者与工具；仅指定工具时仍按入口选能用该工具的操作者。未指定操作者时，Computer Use 的常规、输入清楚、低风险操作由父代理指导 GPT-6.1 Terra 实际执行，复杂界面状态、多步依赖或高风险变更至少用 GPT-6.2 Sol；复杂业务判断留给父代理或合适的 Sol/Astra，同一界面保持一个操作者，默认不可用的回退与明确指定边界见 SKILL.md 对应节；前两档都是常规子代理路线，只有 gpt-6.2-astra 是专家路线；用户指定专家切片时直接选配 Astra，其余仅在最强可行 gpt-6.2-sol 仍有决定性质量差距时使用 Astra，xhigh 只是上限。用户未指定新建或执行者时，同一未完语义任务的小补充继续使用合适的当前子代理，未指定执行者的新增确定性计算仍由父直接处理；未指定执行者时，新的能力类型没有适合当前子代理时只做一次有界台账查询。对未指定的执行者选择，满足以下条件的保留子代理会被复用：当前会话已经加载、属于同一能力族、质量兼容。选中后只读取该保留子代理一次；目录查询失败但当前会话已加载类型中已有符合三项条件的明确候选时，仍只读取该候选一次，读取成功就复用。未指定执行者时，只有没有可核对候选或读取失败时，本次才改用最小运行时子代理；不得把查询失败当成空台账建档。当前子代理与保留子代理都可用时，按入口当前优先级选路，默认在质量达标后比较父子合计成本；持续并行时优先推进就绪切片。固定保留角色按宿主已加载配置调用，原生参数遵守 SKILL.md，不为统计强制换线程。只有用户优先级、并行需求、任务类型、质量门槛、权限或证据边界、专家必要性、预计成本发生实质变化时重新选路；如当前切片仍由用户指定专家或质量仍需 Astra，再独立选择旧线程或另一兼容 Astra 路线，旧线程上下文无边际价值不触发降级。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；首条进展说明展示五行，最终回复顶部重复前三行。复用当前子代理且没有已核验的保留读取状态时，经验行只写“复用当前线程上下文”；运行时经验行写“本次任务上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。核验采用已完成切片或续用增量时，按结果采用入口自动分别判断身份保留和新增经验；符合条件先按结果采用入口核对写入及必要独立回读的具体授权，授权齐备才写入并回读；未回复不执行回读，不先写出无法验收的状态，继续主任务；细则见 SKILL.md 的执行、结果和保留。子代理执行期间正常说明进展、变化和问题，任务卡不得要求默认静默；内部消息去重不限制可见说明，父代理不为普通进度停下主线。实际执行型号命中适用范围时，调用与结果采用消费 references/dispatch-start.md 的“6.2 调用防错”：核对决定性未知、关键要求与完成证据，常规实现自行推进，分别核实审查发现和视觉细节，如实报告工具失败及阻断，无新增证据停止原样循环；不得用模型自报替代验证。单款 6.2 退出时缩小适用集合，专属附加指令随最后一款 6.2 退出同步清理，不自动套用后继型号，通用证据与安全要求保留；型号更新按 references/versioning.md 保持旧调用及同身份兼容。主任务继续。"
