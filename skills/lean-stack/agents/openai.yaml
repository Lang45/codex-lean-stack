interface:
  display_name: "子代理调用"
  short_description: "主任务精简与四档子代理调用并行，优先复用保留身份。"
  default_prompt: "首次准备真实委派时读取或复用 $lean-stack；高价值难题质量优先并派专家；普通工作可靠性相当后总成本优先；总成本可接受时可为提速增派。新调用依次选择 gpt-5.6-luna、gpt-6-sol、gpt-5.6-sol、gpt-6-astra，思考程度从 medium 起；Luna 只做有界读取、结构化提取和事实总结，持续判断至少使用合适的 Sol；前三档都是常规子代理路线，只有 gpt-6-astra 是专家路线；Astra 仅在最强可行 gpt-5.6-sol 仍有决定性质量差距时使用，xhigh 只是上限。同一任务小补充继续兼容 live child；新的能力类型没有适合当前子代理时只做一次有界台账查询。保留类型优先：只有当前工具目录已加载且经单个身份读取核验兼容的具名保留 lean_* agent_type 才优先于 generic 或运行时新建；查询失败或只命中未加载身份时，本次改用最小运行时子代理，不得把查询失败当成空台账建档。当前子代理与保留子代理都可用时，质量达标后选择父子合计总成本更低的一条，不为统计强制换线程。只有任务类型、质量门槛、权限或证据边界、专家必要性、预计成本发生实质变化时重新选路；若当前质量仍需 Astra，再独立选择旧线程或另一兼容 Astra 路线，旧线程上下文无边际价值不触发降级。任务卡只传五行真实状态，第一行名称按实际派发标一次（复用）或（新建）；首条进展说明展示五行，final 顶部重复前三行。复用 live child 且没有已核验的保留召回状态时，经验行只写“复用当前线程上下文”；运行时经验行写“本次任务上下文”；不得显示“未核验持久化经验”等占位语。状态缺失先内部补齐。结果采用后选择性判断保留：只有预计复用收益高于维护和检索负担且满足安全边界的新能力族才建档，主任务继续。"
